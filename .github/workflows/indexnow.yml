name: Submit Sitemap URLs to IndexNow

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  submit-indexnow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Read sitemap and submit URLs to IndexNow
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          import xml.etree.ElementTree as ET

          KEY = "urbanartsnews-indexnow-8f4d2c91"
          HOST = "urbanartsnews.com"
          KEY_LOCATION = "https://urbanartsnews.com/urbanartsnews-indexnow-8f4d2c91.txt"

          tree = ET.parse("sitemap.xml")
          root = tree.getroot()

          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}

          urls = [
              loc.text.strip()
              for loc in root.findall("sm:url/sm:loc", ns)
              if loc.text
          ]

          payload = {
              "host": HOST,
              "key": KEY,
              "keyLocation": KEY_LOCATION,
              "urlList": urls
          }

          data = json.dumps(payload).encode("utf-8")

          request = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=data,
              headers={
                  "Content-Type": "application/json; charset=utf-8"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request) as response:
                  print("IndexNow HTTP status:", response.status)
                  print("Submitted URLs:", len(urls))

                  for url in urls:
                      print("Submitted:", url)

          except urllib.error.HTTPError as error:
              print("IndexNow HTTP error:", error.code)
              print(error.read().decode("utf-8", errors="ignore"))
              raise

          PY
