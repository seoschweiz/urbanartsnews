name: Generate Urban Arts News

on:
  schedule:
    - cron: "23 */6 * * *"

  push:
    branches:
      - main
    paths:
      - "data/artists.json"
      - "generate.py"
      - "generate_los_angeles_gallery.py"
      - "generate_barcelona_gallery.py"
      - "generate_badalona_gallery.py"
      - "generate_buenos_aires_gallery.py"
      - "generate_urban_art_gallery_news.py"
      - "generate_urban_art_music.py"
      - "generate_language_pages.py"
      - "generate_art_is_trash_languages.py"
      - "generate_ashwan_languages.py"
      - "seo_finalize.py"
      - "add_contributor_metadata.py"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        run: |
          python -m pip install --disable-pip-version-check Pillow
          sudo apt-get update
          sudo apt-get install -y libimage-exiftool-perl

      - name: Generate artist and city pages
        run: python generate.py

      - name: Generate responsive Art Is Trash images
        run: python optimize_art_is_trash_images.py

      - name: Generate Los Angeles photo gallery
        run: python generate_los_angeles_gallery.py

      - name: Generate Barcelona photo gallery
        run: python generate_barcelona_gallery.py

      - name: Generate Badalona photo gallery
        run: python generate_badalona_gallery.py

      - name: Generate Buenos Aires photo gallery
        run: python generate_buenos_aires_gallery.py

      - name: Generate Urban Art Music pages
        run: python generate_urban_art_music.py

      - name: Generate Urban Art Gallery News register
        run: python generate_urban_art_gallery_news.py

      - name: Generate language landing pages
        run: python generate_language_pages.py

      - name: Generate Art Is Trash language profiles
        run: python generate_art_is_trash_languages.py

      - name: Generate Ashwan language profiles
        continue-on-error: true
        run: python generate_ashwan_languages.py

      - name: Apply site-wide SEO baseline
        run: python seo_finalize.py

      - name: Add Rodriquez Ventura contributor metadata to images
        run: python add_contributor_metadata.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A index.html artists cities urban-art-cities urban-art-music urban-art-gallery-news images assets tags subscribe street-art-galleries-barcelona languages sq de es ca pt it fr ja ar ru sv ko hi sitemap.xml image-sitemap-los-angeles.xml image-sitemap-barcelona.xml image-sitemap-badalona.xml image-sitemap-buenos-aires.xml image-sitemap-urban-art-gallery-news.xml robots.txt data

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Generate Urban Arts News pages"
            git push
          fi
