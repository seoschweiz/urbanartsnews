name: Generate Urban Arts News

on:
  schedule:
    - cron: "23 */6 * * *"

  push:
    branches:
      - main
    paths:
      - "data/artists.json"
      - "generate.py"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image optimizer
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate artist and city pages
        run: python generate.py

      - name: Generate responsive Art Is Trash images
        run: python optimize_art_is_trash_images.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A index.html artists cities urban-art-cities images assets tags sitemap.xml data/post_status.json

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Generate Urban Arts News pages"
            git push
          fi
