name: Generate Urban Arts News

on:
  schedule:
    - cron: "23 */6 * * *"

  push:
    branches:
      - main
    paths:
      - "data/artists.json"
      - "generate.py"
      - "generate_los_angeles_gallery.py"
      - "generate_barcelona_gallery.py"
      - "generate_badalona_gallery.py"
      - "generate_buenos_aires_gallery.py"
      - "generate_urban_art_gallery_news.py"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image optimizer
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate artist and city pages
        run: python generate.py

      - name: Generate responsive Art Is Trash images
        run: python optimize_art_is_trash_images.py

      - name: Generate Los Angeles photo gallery
        run: python generate_los_angeles_gallery.py

      - name: Generate Barcelona photo gallery
        run: python generate_barcelona_gallery.py

      - name: Generate Badalona photo gallery
        run: python generate_badalona_gallery.py

      - name: Generate Buenos Aires photo gallery
        run: python generate_buenos_aires_gallery.py

      - name: Generate Urban Art Music pages
        run: python generate_urban_art_music.py

      - name: Generate Urban Art Gallery News register
        run: python generate_urban_art_gallery_news.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A index.html artists cities urban-art-cities urban-art-music urban-art-gallery-news images assets tags sitemap.xml image-sitemap-los-angeles.xml image-sitemap-barcelona.xml image-sitemap-badalona.xml image-sitemap-buenos-aires.xml image-sitemap-urban-art-gallery-news.xml robots.txt data

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Generate Urban Arts News pages"
            git push
          fi
