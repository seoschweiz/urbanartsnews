name: Translate Barcelona Urban Art City Page

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "urban-art-city/barcelona/spain/index.html"
      - "translate_barcelona_urban_art_city.py"
      - ".github/workflows/translate-barcelona-urban-art-city.yml"

permissions:
  contents: write

concurrency:
  group: translate-barcelona-urban-art-city
  cancel-in-progress: true

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install translation tools
        run: python -m pip install --disable-pip-version-check beautifulsoup4 deep-translator
      - name: Create all city-page translations
        run: python translate_barcelona_urban_art_city.py
      - name: Validate all 19 language pages
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          from translate_barcelona_urban_art_city import LANGUAGES
          for code,(_,slug) in LANGUAGES.items():
              page=Path(code)/slug/"index.html"
              text=page.read_text(encoding="utf-8")
              soup=BeautifulSoup(text,"html.parser")
              assert soup.html.get("lang")==code
              assert soup.html.get("dir")==("rtl" if code=="ar" else "ltr")
              assert len(soup.get_text(" ",strip=True))>=3000
              assert len(soup.find_all("link",attrs={"rel":"alternate","hreflang":True}))>=20
              assert len(soup.select('h2 a[href*="instagram.com"]'))==11
              assert soup.find("link",rel="canonical")
              assert soup.find("script",attrs={"type":"application/ld+json"})
          print("Validated English plus",len(LANGUAGES),"city-page translations")
          PY
      - name: Commit translated city pages and sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ar ca da de el es fr it ja ko nl no pl pt ru sv tr zh-hans sitemap.xml
          if git diff --cached --quiet; then
            echo "No translation changes."
          else
            git commit -m "Publish Barcelona urban-art city page in 19 languages"
            git push
          fi
