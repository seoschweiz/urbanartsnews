name: Translate Barcelona Gallery Guide

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "translate_barcelona_gallery_full.py"
      - ".github/workflows/translate-barcelona-galleries.yml"

permissions:
  contents: write

concurrency:
  group: translate-barcelona-gallery
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install translation tools
        run: python -m pip install --disable-pip-version-check beautifulsoup4 deep-translator
      - name: Translate complete master page
        run: python translate_barcelona_gallery_full.py
      - name: Validate all language pages
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          from translate_barcelona_gallery_full import LANGUAGES
          for code, (_, slug) in LANGUAGES.items():
              page = Path(code) / slug / "index.html"
              text = page.read_text(encoding="utf-8")
              soup = BeautifulSoup(text, "html.parser")
              assert len(text) > 30000, (code, len(text))
              assert soup.html.get("lang") == code
              assert soup.html.get("dir") == ("rtl" if code == "ar" else "ltr")
              assert "hreflang=" in text and "application/ld+json" in text
              assert "MARK ROX" in text and "41.379861" in text
          print("Validated", len(LANGUAGES), "complete translations")
          PY
      - name: Commit translated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ar ca da de el es fr it ja ko nl no pl pt ru sv tr zh-hans
          if git diff --cached --quiet; then
            echo "No translation changes."
          else
            git commit -m "Publish complete Barcelona gallery translations"
            git push
          fi
